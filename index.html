<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fight Club Zimin Cards</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#000;
  color:#d4af37;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
#cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}
.card{
  background:#222;
  border:1px solid #444;
  border-radius:10px;
  overflow:hidden;
}
.card img{
  width:100%;
  display:block;
}
button{
  width:calc(100% - 20px);
  margin:10px;
  padding:14px;
  background:#d4af37;
  border:0;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>FIGHT CLUB ZIMIN</header>

<button onclick="loadCards()">ЗАГРУЗИТЬ КАРТЫ</button>

<div id="cards"></div>

<script>
async function loadCards(){

  const box=document.getElementById("cards");
  box.innerHTML="Загрузка...";

  const repo="vitalizimin0-tech/Fight-club-zimin-cards";

  try{
    const response=await fetch(
      "https://api.github.com/repos/"+repo+"/contents/"
    );

    const files=await response.json();

    box.innerHTML="";

    files
      .filter(file =>
        file.name.toLowerCase().endsWith(".jpg") ||
        file.name.toLowerCase().endsWith(".jpeg") ||
        file.name.toLowerCase().endsWith(".png") ||
        file.name.toLowerCase().endsWith(".webp")
      )
      .forEach(file=>{

        const card=document.createElement("div");
        card.className="card";

        const img=document.createElement("img");
        img.src=file.download_url;

        card.appendChild(img);
        box.appendChild(card);

      });

  }catch(error){
    box.innerHTML="Ошибка загрузки карт";
  }
}

loadCards();
  document.addEventListener("click", function(e) {
  if (e.target.tagName === "IMG" && e.target.closest(".card")) {
    e.target.requestFullscreen?.();
  }
});
  let startX = 0;

document.addEventListener("touchstart", function(e) {
  if (document.fullscreenElement) {
    startX = e.touches[0].clientX;
  }
});

document.addEventListener("touchend", function(e) {
  if (!document.fullscreenElement) return;

  const endX = e.changedTouches[0].clientX;
  const diff = endX - startX;

  if (Math.abs(diff) < 50) return;

  const images = Array.from(document.querySelectorAll(".card img"));
  const current = document.fullscreenElement;
  const index = images.indexOf(current);

  let nextIndex;

  if (diff < 0) {
    nextIndex = (index + 1) % images.length;
  } else {
    nextIndex = (index - 1 + images.length) % images.length;
  }

current.src = images[nextIndex].src;
});
</script>

</body>
</html>
